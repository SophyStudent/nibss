openapi: 3.0.0

info:
  title: NIBSS API
  version: 1.0.0
  description: NIBSS fintech banking API

servers:
  - url: http://localhost:3000
    description: Local development server

paths:
  /api/auth/register:
    post:
      summary: Register a new customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
                - password
              properties:
                name:
                  type: string
                email:
                  type: string
                password:
                  type: string
      responses:
        "201":
          description: Customer registered successfully

  /api/auth/login:
    post:
      summary: Authenticate a customer        
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        "200":
          description: Customer authenticated successfully
      
    /api/customers/me:
    get:
      summary: Get authenticated customer profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Customer profile retrieved successfully
        "401":
          description: Unauthorized


  /api/kyc/bvn:
    post:
      summary: Verify customer BVN
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - bvn
              properties:
                bvn:
                  type: string
                  description: Customer's 11-digit BVN
                  example: "12345678901"
      responses:
        "200":
          description: BVN verified successfully
        "400":
          description: Invalid BVN
        "401":
          description: Unauthorized


  /api/kyc/nin:
    post:
      summary: Verify customer NIN
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - nin
              properties:
                nin:
                  type: string
                  description: Customer's NIN
                  example: "1234567890123"
      responses:
        "200":
          description: NIN verified successfully
        "400":
          description: Invalid NIN
        "401":
          description: Unauthorized


  /api/accounts:
    post:
      summary: Create a customer bank account
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - accountType
              properties:
                accountType:
                  type: string
                  example: savings
      responses:
        "201":
          description: Account created successfully
        "400":
          description: Invalid request or KYC not completed
        "401":
          description: Unauthorized

    get:
      summary: Get customer accounts
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Customer accounts retrieved successfully
        "401":
          description: Unauthorized


  /api/accounts/{accountNumber}:
    get:
      summary: Get a specific customer account
      security:
        - bearerAuth: []
      parameters:
        - name: accountNumber
          in: path
          required: true
          schema:
            type: string
          example: "1234567890"
      responses:
        "200":
          description: Account retrieved successfully
        "401":
          description: Unauthorized
        "404":
          description: Account not found


  /api/accounts/{accountNumber}/balance:
    get:
      summary: Get account balance
      security:
        - bearerAuth: []
      parameters:
        - name: accountNumber
          in: path
          required: true
          schema:
            type: string
          example: "1234567890"
      responses:
        "200":
          description: Account balance retrieved successfully
        "401":
          description: Unauthorized
        "404":
          description: Account not found


  /api/transactions/transfer:
    post:
      summary: Initiate a fund transfer
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - fromAccount
                - toAccount
                - amount
              properties:
                fromAccount:
                  type: string
                  description: Sender's account number
                  example: "1234567890"
                toAccount:
                  type: string
                  description: Recipient's account number
                  example: "0987654321"
                amount:
                  type: number
                  description: Amount to transfer
                  example: 5000
      responses:
        "201":
          description: Transfer initiated successfully
        "400":
          description: Invalid request or insufficient funds
        "401":
          description: Unauthorized


    /api/transactions:
    get:
      summary: Get customer transaction history
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Transaction history retrieved successfully
        "401":
          description: Unauthorized

  /api/transactions/{transactionId}:
    get:
      summary: Get transaction details
      security:
        - bearerAuth: []
      parameters:
        - name: transactionId
          in: path
          required: true
          schema:
            type: string
          example: "TXN-123456789"
      responses:
        "200":
          description: Transaction details retrieved successfully
        "401":
          description: Unauthorized
        "404":
          description: Transaction not found

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT