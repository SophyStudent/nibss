openapi: 3.0.0

info:
  title: NIBSS API
  version: 1.0.0
  description: NIBSS fintech banking API

servers:
  - url: http://localhost:3000
    description: Local development server

paths:
  /api/auth/register:
    post:
      summary: Register a new customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterCustomerRequest"
      responses:
        "201":
          description: Customer registered successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerResponse"

  /api/auth/login:
    post:
      summary: Authenticate a customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"

  /api/customers/me:
    get:
      summary: Get authenticated customer profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Customer profile retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerResponse"
        "401":
          description: Unauthorized

  /api/kyc/bvn:
    post:
      summary: Verify customer BVN
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyBvnRequest"
      responses:
        "200":
          description: BVN verified successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KycVerificationResponse"
        "400":
          description: Invalid BVN
        "401":
          description: Unauthorized

  /api/kyc/nin:
    post:
      summary: Verify customer NIN
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyNinRequest"
      responses:
        "200":
          description: NIN verified successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KycVerificationResponse"
        "400":
          description: Invalid NIN
        "401":
          description: Unauthorized

  /api/kyc/status:
    get:
      summary: Get customer KYC status
      security:
        - bearerAuth: []
      responses:
        "200":
          description: KYC status retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KycStatusResponse"
        "401":
          description: Unauthorized

  /api/accounts:
    post:
      summary: Create a customer bank account
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAccountRequest"
      responses:
        "201":
          description: Account created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountResponse"
        "400":
          description: Invalid request or KYC not completed
        "401":
          description: Unauthorized

    get:
      summary: Get customer accounts
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Customer accounts retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AccountResponse"
        "401":
          description: Unauthorized

  /api/accounts/{accountNumber}:
    get:
      summary: Get a specific customer account
      security:
        - bearerAuth: []
      parameters:
        - name: accountNumber
          in: path
          required: true
          schema:
            type: string
          example: "1234567890"
      responses:
        "200":
          description: Account retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountResponse"
        "401":
          description: Unauthorized
        "404":
          description: Account not found

  /api/accounts/{accountNumber}/balance:
    get:
      summary: Get account balance
      security:
        - bearerAuth: []
      parameters:
        - name: accountNumber
          in: path
          required: true
          schema:
            type: string
          example: "1234567890"
      responses:
        "200":
          description: Account balance retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountBalanceResponse"
        "401":
          description: Unauthorized
        "404":
          description: Account not found

  /api/transactions/transfer:
    post:
      summary: Initiate a fund transfer
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferRequest"
      responses:
        "201":
          description: Transfer initiated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionResponse"
        "400":
          description: Invalid request or insufficient funds
        "401":
          description: Unauthorized

  /api/transactions:
    get:
      summary: Get customer transaction history
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Transaction history retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TransactionResponse"
        "401":
          description: Unauthorized

  /api/transactions/{transactionId}:
    get:
      summary: Get transaction details
      security:
        - bearerAuth: []
      parameters:
        - name: transactionId
          in: path
          required: true
          schema:
            type: string
          example: "TXN-123456789"
      responses:
        "200":
          description: Transaction details retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionResponse"
        "401":
          description: Unauthorized
        "404":
          description: Transaction not found

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    RegisterCustomerRequest:
      type: object
      required:
        - name
        - email
        - password
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    LoginResponse:
      type: object
      properties:
        message:
          type: string
        token:
          type: string
        customer:
          type: object
          properties:
            name:
              type: string
            email:
              type: string

    CustomerResponse:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email

    VerifyBvnRequest:
      type: object
      required:
        - bvn
        - firstName
        - lastName
        - dob
        - phone
      properties:
        bvn:
          type: string
          example: "10840712848"
        firstName:
          type: string
          example: "Chisom"
        lastName:
          type: string
          example: "Abraham"
        dob:
          type: string
          format: date
          example: "1990-05-15"
        phone:
          type: string
          example: "08012345678"
      example:
        bvn: "10840712848"
        firstName: "Chisom"
        lastName: "Abraham"
        dob: "1990-05-15"
        phone: "08012345678"

    VerifyNinRequest:
      type: object
      required:
        - nin
        - firstName
        - lastName
        - dob
      properties:
        nin:
          type: string
          example: "10840712849"
        firstName:
          type: string
          example: "Chisom"
        lastName:
          type: string
          example: "Abraham"
        dob:
          type: string
          format: date
          example: "1990-05-15"
      example:
        nin: "10840712849"
        firstName: "Chisom"
        lastName: "Abraham"
        dob: "1990-05-15"

    KycVerificationResponse:
      type: object
      properties:
        message:
          type: string
          example: "Verification successful"
        status:
          type: string
          example: "verified"

    KycStatusResponse:
      type: object
      properties:
        status:
          type: object
          properties:
            bvnVerified:
              type: boolean
              example: true
            ninVerified:
              type: boolean
              example: false
      example:
        status:
          bvnVerified: true
          ninVerified: false

    CreateAccountRequest:
      type: object
      required:
        - accountType
        - dob
      properties:
        accountType:
          type: string
          example: "savings"
        dob:
          type: string
          format: date
          example: "1990-05-15"
      example:
        accountType: "savings"
        dob: "1990-05-15"

    AccountResponse:
      type: object
      properties:
        id:
          type: integer
          example: 1
        accountNumber:
          type: string
          example: "1234567890"
        accountType:
          type: string
          example: "savings"
        balance:
          type: number
          example: 50000
        createdAt:
          type: string
          format: date-time
          example: "2026-01-15T10:00:00Z"

    AccountBalanceResponse:
      type: object
      properties:
        accountNumber:
          type: string
          example: "1234567890"
        balance:
          type: number
          example: 50000

    TransferRequest:
      type: object
      required:
        - fromAccount
        - toAccount
        - amount
      properties:
        fromAccount:
          type: string
          description: Sender's account number
          example: "1234567890"
        toAccount:
          type: string
          description: Recipient's account number
          example: "0987654321"
        amount:
          type: number
          description: Amount to transfer
          example: 5000

    TransactionResponse:
      type: object
      properties:
        id:
          type: integer
          example: 1
        transactionId:
          type: string
          example: "TXN-123456789"
        fromAccount:
          type: string
          description: Sender's account number
          example: "1234567890"
        toAccount:
          type: string
          description: Recipient's account number
          example: "0987654321"
        amount:
          type: number
          description: Amount to transfer
          example: 5000
        status:
          type: string
          example: "successful"
        createdAt:
          type: string
          format: date-time
          example: "2026-01-15T10:30:00Z"