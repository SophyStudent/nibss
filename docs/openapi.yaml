openapi: 3.0.0

info:
  title: NIBSS API
  version: 1.0.0
  description: NIBSS fintech banking API

servers:
  - url: https://nibss-a2rm.vercel.app
    description: Production server (Vercel)
  - url: http://localhost:3000
    description: Local development server

paths:

  /api/auth/register:
    post:
      summary: Register a new customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterCustomerRequest"
      responses:
        "201":
          description: Customer registered successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerResponse"
        "400":
          description: Invalid registration data

  /api/auth/login:
    post:
      summary: Authenticate a customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Invalid credentials

  /api/customers/me:
    get:
      summary: Get authenticated customer profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Customer profile retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerResponse"
        "401":
          description: Unauthorized

  /api/kyc/bvn:
    post:
      summary: Verify customer BVN
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyBvnRequest"
      responses:
        "200":
          description: BVN verified successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KycVerificationResponse"
        "400":
          description: Invalid BVN or request
        "401":
          description: Unauthorized

  /api/kyc/nin:
    post:
      summary: Verify customer NIN
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyNinRequest"
      responses:
        "200":
          description: NIN verified successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KycVerificationResponse"
        "400":
          description: Invalid NIN or request
        "401":
          description: Unauthorized

  /api/kyc/status:
    get:
      summary: Get customer KYC status
      security:
        - bearerAuth: []
      responses:
        "200":
          description: KYC status retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KycStatusResponse"
        "401":
          description: Unauthorized

  /api/accounts:
    post:
      summary: Create a customer bank account
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAccountRequest"
      responses:
        "201":
          description: Account created successfully
        "400":
          description: Invalid request or KYC not completed
        "401":
          description: Unauthorized

    get:
      summary: Get customer accounts
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Customer accounts retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  accounts:
                    type: array
                    items:
                      $ref: "#/components/schemas/AccountResponse"
        "401":
          description: Unauthorized

  /api/accounts/{accountNumber}:
    get:
      summary: Get a specific customer account
      security:
        - bearerAuth: []
      parameters:
        - name: accountNumber
          in: path
          required: true
          description: Customer account number
          schema:
            type: string
            pattern: '^\d{10}$'
          example: "1234567890"
      responses:
        "200":
          description: Account retrieved successfully
        "400":
          description: Invalid account number
        "401":
          description: Unauthorized
        "404":
          description: Account not found

  /api/accounts/{accountNumber}/balance:
    get:
      summary: Get account balance
      security:
        - bearerAuth: []
      parameters:
        - name: accountNumber
          in: path
          required: true
          description: Customer account number
          schema:
            type: string
            pattern: '^\d{10}$'
          example: "1234567890"
      responses:
        "200":
          description: Account balance retrieved successfully
        "400":
          description: Invalid account number
        "401":
          description: Unauthorized
        "404":
          description: Account not found

  /api/transactions/transfer:
    post:
      summary: Initiate a fund transfer
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferRequest"
      responses:
        "201":
          description: Transfer successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransferResponse"
        "400":
          description: Invalid request or KYC requirement
        "401":
          description: Unauthorized
        "404":
          description: Account or recipient not found
        "502":
          description: NIBSS transfer failure

  /api/transactions:
    get:
      summary: Get customer transaction history
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Transaction history retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionHistoryResponse"
        "401":
          description: Unauthorized

  /api/transactions/{transactionId}:
    get:
      summary: Get transaction details
      security:
        - bearerAuth: []
      parameters:
        - name: transactionId
          in: path
          required: true
          description: NIBSS transaction reference
          schema:
            type: string
          example: "TX1789936484255"
      responses:
        "200":
          description: Transaction retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SingleTransactionResponse"
        "401":
          description: Unauthorized
        "404":
          description: Transaction not found

components:

  securitySchemes:

    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:

    RegisterCustomerRequest:
      type: object
      required:
        - name
        - email
        - password
      properties:
        name:
          type: string
          example: "Chisom Abraham"
        email:
          type: string
          format: email
          example: "customer@example.com"
        password:
          type: string
          format: password
          example: "password123"

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: "customer@example.com"
        password:
          type: string
          format: password
          example: "password123"

    LoginResponse:
      type: object
      properties:
        message:
          type: string
          example: "Login successful"
        token:
          type: string
          example: "eyJhbGciOiJIUzI1NiIs..."
        customer:
          type: object
          properties:
            name:
              type: string
              example: "Chisom Abraham"
            email:
              type: string
              example: "customer@example.com"

    CustomerResponse:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "Chisom Abraham"
        email:
          type: string
          format: email
          example: "customer@example.com"

    VerifyBvnRequest:
      type: object
      required:
        - bvn
        - firstName
        - lastName
        - dob
        - phone
      properties:
        bvn:
          type: string
          pattern: '^\d{11}$'
          example: "10840712848"
        firstName:
          type: string
          example: "Chisom"
        lastName:
          type: string
          example: "Abraham"
        dob:
          type: string
          format: date
          example: "1990-05-15"
        phone:
          type: string
          example: "08012345678"

    VerifyNinRequest:
      type: object
      required:
        - nin
        - firstName
        - lastName
        - dob
      properties:
        nin:
          type: string
          pattern: '^\d{11}$'
          example: "10840712849"
        firstName:
          type: string
          example: "Chisom"
        lastName:
          type: string
          example: "Abraham"
        dob:
          type: string
          format: date
          example: "1990-05-15"

    KycVerificationResponse:
      type: object
      properties:
        message:
          type: string
          example: "Verification successful"
        status:
          type: string
          example: "verified"

    KycStatusResponse:
      type: object
      properties:
        status:
          type: object
          properties:
            bvnVerified:
              type: boolean
              example: true
            ninVerified:
              type: boolean
              example: false

    CreateAccountRequest:
      type: object
      required:
        - kycType
        - kycID
        - dob
      properties:
        kycType:
          type: string
          enum:
            - bvn
            - nin
          example: "bvn"
        kycID:
          type: string
          pattern: '^\d{11}$'
          example: "10840712848"
        dob:
          type: string
          format: date
          example: "1990-05-15"

    AccountResponse:
      type: object
      properties:
        id:
          type: integer
          example: 4
        customer_id:
          type: integer
          example: 5
        account_number:
          type: string
          example: "3131066750"
        account_type:
          type: string
          example: "savings"
        created_at:
          type: string
          format: date-time
          example: "2026-09-20T19:00:00Z"

    TransferRequest:
      type: object
      required:
        - fromAccount
        - toAccount
        - amount
      properties:
        fromAccount:
          type: string
          pattern: '^\d{10}$'
          example: "3131066750"
        toAccount:
          type: string
          pattern: '^\d{10}$'
          example: "3135379018"
        amount:
          type: number
          format: double
          minimum: 0.01
          example: 5000

    TransferResponse:
      type: object
      properties:
        message:
          type: string
          example: "Transfer successful"
        result:
          type: object
          properties:
            transaction:
              $ref: "#/components/schemas/Transaction"
            nibss:
              type: object
              properties:
                reference:
                  type: string
                  example: "TX1789936484255"
                senderAccount:
                  type: string
                  example: "3131066750"
                receiverAccount:
                  type: string
                  example: "3135379018"
                amount:
                  type: number
                  example: 5000
                status:
                  type: string
                  example: "SUCCESS"

    Transaction:
      type: object
      properties:
        id:
          type: integer
          example: 1
        transaction_id:
          type: string
          example: "TX1789936484255"
        from_account_id:
          type: integer
          example: 4
        to_account_number:
          type: string
          example: "3135379018"
        amount:
          type: string
          example: "5000.00"
        status:
          type: string
          example: "SUCCESS"
        created_at:
          type: string
          format: date-time
          example: "2026-09-20T19:34:44.764Z"

    TransactionHistoryResponse:
      type: object
      properties:
        transactions:
          type: array
          items:
            $ref: "#/components/schemas/Transaction"

    SingleTransactionResponse:
      type: object
      properties:
        transaction:
          $ref: "#/components/schemas/Transaction"